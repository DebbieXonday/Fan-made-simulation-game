<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>悟咪养成模拟器 · 新宿雨夜篇</title>
<style>
:root{
  --bg:#141416;--panel:#1e1e21;--panel2:#262629;--line:#3a3a3e;
  --tx:#f0f0f0;--tx2:#b9b9bd;--tx3:#828287;
  --rose:#f472b6;--roseSoft:rgba(244,114,182,.16);--blue:#7dd3fc;--amber:#fbbf24;
  --r:12px;
}
@media (prefers-color-scheme: light){
  :root{--bg:#f6f5f3;--panel:#ffffff;--panel2:#efeeec;--line:#e0dedb;--tx:#1c1c1e;--tx2:#55555a;--tx3:#929298;}
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;padding:14px 10px 40px;line-height:1.9}
#wrap{max-width:860px;margin:0 auto}
button{font:inherit;cursor:pointer;color:var(--tx)}
.chip{display:inline-block;padding:2px 10px;border-radius:6px;font-size:12px;background:var(--panel2);color:var(--tx2)}
.chip.on{background:var(--roseSoft);color:var(--rose)}
/* ---------- title ---------- */
#title{position:relative;border-radius:var(--r);overflow:hidden;min-height:420px;display:flex;flex-direction:column;justify-content:flex-end;padding:28px}
#title .bgimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:brightness(.55) saturate(1.05)}
#title>div{position:relative}
#title h1{font-size:26px;font-weight:500;letter-spacing:2px;text-shadow:0 2px 12px rgba(0,0,0,.6)}
#title p{font-size:14px;color:#e8e8ea;margin:6px 0 18px;text-shadow:0 1px 8px rgba(0,0,0,.6)}
#title button{border:1px solid rgba(255,255,255,.4);background:rgba(20,20,22,.55);color:#fff;border-radius:10px;padding:10px 26px;font-size:15px;backdrop-filter:blur(4px);transition:all .15s}
#title button:hover{background:rgba(244,114,182,.25);border-color:var(--rose)}
#title button.ghost{background:transparent;border-color:rgba(255,255,255,.25);margin-left:10px}
/* ---------- stage ---------- */
#stage{position:relative;border-radius:var(--r);overflow:hidden;aspect-ratio:16/9.5;background:#000}
#stage .bgimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:opacity .5s}
#sceneName{position:absolute;top:10px;left:12px;z-index:3;font-size:12px;color:#fff;background:rgba(0,0,0,.45);padding:3px 12px;border-radius:99px;backdrop-filter:blur(3px)}
#avatar{position:absolute;right:1%;bottom:-2%;height:86%;z-index:2;filter:drop-shadow(0 8px 18px rgba(0,0,0,.55));transition:opacity .3s,transform .3s;animation:bob 4s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
#avatar.shake{animation:shk .5s}
@keyframes shk{0%,100%{transform:translateX(0)}20%{transform:translateX(-10px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
#shade{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.55),transparent 45%);z-index:1}
/* ---------- narr ---------- */
#narrBox{margin-top:10px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;min-height:96px;font-size:15px;color:var(--tx)}
#narr{white-space:pre-wrap}
#caret{display:inline-block;width:8px;color:var(--rose);animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
/* ---------- actions ---------- */
#actions{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
#actions button{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 6px;font-size:13.5px;transition:all .13s}
#actions button:hover{background:var(--panel2);border-color:var(--rose);color:var(--rose)}
#actions button:active{transform:scale(.96)}
/* ---------- stats ---------- */
#stats{margin-top:12px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
#statRow{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;color:var(--tx2);margin-bottom:6px}
#affNum{font-variant-numeric:tabular-nums;color:var(--tx)}
.bar{height:7px;border-radius:99px;background:var(--panel2);overflow:hidden;margin-bottom:10px}
.bar>div{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--rose),#fb923c);transition:width .4s}
#steps{display:flex;gap:6px;margin-top:2px}
#steps .chip{flex:1;text-align:center}
#foot{margin-top:10px;display:flex;gap:8px}
#foot button{flex:1;background:transparent;border:1px solid var(--line);border-radius:10px;padding:8px;font-size:13px;color:var(--tx3)}
#foot button:hover{color:var(--tx);border-color:var(--tx3)}
/* ---------- event overlay ---------- */
#ev{position:fixed;inset:0;z-index:50;background:rgba(8,8,10,.78);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;padding:20px}
#ev.show{display:flex}
#evCard{max-width:420px;width:100%;background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden;animation:pop .35s cubic-bezier(.2,.8,.2,1)}
@keyframes pop{from{transform:scale(.9);opacity:0}}
#evCard img{width:100%;max-height:280px;object-fit:cover;display:block}
#evBody{padding:16px 18px 18px}
#evTitle{font-size:17px;font-weight:500;color:var(--rose);margin-bottom:6px}
#evText{font-size:14px;color:var(--tx2)}
#evBtn{margin-top:14px;width:100%;background:var(--rose);border:none;color:#2a0a1a;font-weight:500;border-radius:10px;padding:10px;font-size:14px}
#saveTip{font-size:12px;color:var(--tx3);text-align:center;margin-top:8px}
@media (max-width:640px){
  #actions{grid-template-columns:repeat(2,1fr)}
  #avatar{height:72%}
  #title{min-height:360px}
}
</style>
</head>
<body>
<div id="wrap">
  <div id="title">
    <img class="bgimg" id="titleBg">
    <div>
      <h1>悟咪养成模拟器</h1>
      <p>新宿决战后的雨夜 · 你在街角捡到的那只小白猫，身体里住着完整的他</p>
      <button id="btnStart">开始新的雨夜</button>
      <button id="btnContinue" class="ghost" style="display:none">继续上次的存档</button>
    </div>
  </div>

  <div id="game" style="display:none">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;flex-wrap:wrap;gap:6px">
      <div style="font-size:16px;font-weight:500">悟咪养成模拟器</div>
      <div style="display:flex;gap:6px;align-items:center">
        <span class="chip" id="dayChip">第 1 天</span>
        <span class="chip on" id="stageChip">纯白幼猫形态</span>
        <span class="chip" id="moodChip">心情：平静</span>
        <span class="chip" id="satChip">饱食：微饿</span>
      </div>
    </div>

    <div id="stage">
      <img class="bgimg" id="bg">
      <div id="shade"></div>
      <div id="sceneName">街角 · 雨夜</div>
      <img id="avatar">
    </div>

    <div id="narrBox"><span id="narr"></span><span id="caret">▌</span></div>
    <div id="actions"></div>

    <div id="stats">
      <div id="statRow"><span>羁绊 · 好感度</span><span><b id="affNum" style="font-weight:500">??</b> / 100</span></div>
      <div class="bar"><div id="affBar" style="width:25%"></div></div>
      <div id="steps">
        <span class="chip on">幼猫 · 0</span><span class="chip">通灵 · 41</span><span class="chip">少年 · 71</span><span class="chip">成年 · 91</span>
      </div>
    </div>

    <div id="foot">
      <button id="btnQuery">查询亲密度</button>
      <button id="btnReset">重置进度</button>
    </div>
    <div id="saveTip">进度自动保存在本机浏览器</div>
  </div>
</div>

<div id="ev">
  <div id="evCard">
    <img id="evImg">
    <div id="evBody">
      <div id="evTitle"></div>
      <div id="evText"></div>
      <button id="evBtn">继续</button>
    </div>
  </div>
</div>

<script>
var $=function(id){return document.getElementById(id)};
var SAVE_KEY='gojiSimV2';
var S=null, typing=null, typeCb=null, currentActs=[];

function fresh(){return {aff:25,mood:45,sat:30,day:1,scene:'street',phase:'title',queried:false,hugN:0,annoyed:false,inv:{d:0},beat:0,ended:false,lastAvatar:''}}
function save(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(S))}catch(e){}}
function load(){try{var s=localStorage.getItem(SAVE_KEY);return s?JSON.parse(s):null}catch(e){return null}}

/* ---------- narration typewriter ---------- */
function say(text,cb){
  var el=$('narr');el.textContent='';$('caret').style.display='inline-block';typeCb=cb||null;
  var i=0;clearInterval(typing);
  typing=setInterval(function(){
    if(i<text.length){el.textContent+=text[i++];}
    else{finishType();}
  },26);
}
function finishType(){clearInterval(typing);typing=null;$('caret').style.display='none';if(typeCb){var f=typeCb;typeCb=null;f();}}
$('narrBox').addEventListener('click',function(){if(typing)finishType();});

/* ---------- avatar ---------- */
function setAvatar(key){
  if(S.scene==='park'&&!key){$('avatar').style.opacity=0;return;}
  var k=key||defaultAvatar();
  if(k===S.lastAvatar){return;}
  S.lastAvatar=k;
  var a=$('avatar');a.style.opacity=0;
  setTimeout(function(){a.src=IMGS[k];a.style.opacity=1;},160);
}
function defaultAvatar(){
  if(S.annoyed)return 'cat_cool';
  if(S.aff>=71)return 'chibi_boy';
  if(S.mood<30)return 'chibi_shy';
  return 'cat_cool';
}
function shakeAvatar(){$('avatar').classList.remove('shake');void $('avatar').offsetWidth;$('avatar').classList.add('shake');}

/* ---------- scene ---------- */
var SCENE_NAMES={street:'街角 · 雨夜',store:'便利店 · 暖光',home:'家 · 窗前',park:'夜公园 · 树影'};
function setScene(k){S.scene=k;$('bg').src=IMGS[k];$('sceneName').textContent=SCENE_NAMES[k];S.lastAvatar='';setAvatar();}

/* ---------- helpers ---------- */
function pick(a){return a[Math.floor(Math.random()*a.length)]}
function stage(){return S.aff<41?'纯白幼猫形态':S.aff<71?'半通灵猫咪形态':S.aff<91?'少年半人形态':'成年完全人形'}
function gain(g,hm,hs){var old=S.aff;S.aff=Math.min(100,S.aff+g);S.mood=Math.max(0,Math.min(100,S.mood+(hm||0)));if(hs)S.sat=Math.max(0,Math.min(100,S.sat+hs));checkMS(old);render();save();}
function moodWord(){return S.mood>70?'很好':S.mood>40?'平静':'低落'}
function satWord(){return S.sat>65?'饱腹':S.sat>30?'微饿':'很饿'}

/* ---------- milestones ---------- */
var MS=[{"v": 31, "t": "放下戒备", "img": "chibi_shy", "m": "它不再远远地观察你了。夜里你翻身的时候，有一团温热悄悄靠了过来——它开始允许自己靠近你。"}, {"v": 41, "t": "半通灵猫咪", "img": "cat_happy", "m": "清晨你发现它长大了一圈，蓬松的尾巴扫过你的手背。那双冰蓝猫眼里的狡黠藏都藏不住——但枷锁未破，它依旧说不了人话。"}, {"v": 56, "t": "心生偏爱", "img": "chibi_shy", "m": "它开始在意你的视线落在别处。战争的旧伤偶尔在深夜压弯它的背，它不吵不闹，只是安静蜷成一小团，守在你的枕边。"}, {"v": 71, "t": "化形解锁", "img": "chibi_boy", "m": "雨停的那个清晨，窗台上白光一闪——白发少年抱着膝盖坐在那里，苍蓝六眼望向你，笑了：\n「哟。按猫的日子算，好久不见了。」"}, {"v": 91, "t": "成年完全体", "img": "park", "m": "完整的五条悟站在晨光里，190cm的影子把你整个罩住。然后他当着你的面变回小白猫，理直气壮地窝进你怀里。\n「这样比较暖和。」"}, {"v": 100, "t": "结局 · 零刻之后", "img": "cat_happy", "m": "新宿的雨早就停了。\n他曾经以为自己会作为「最强」死在战场上，连一句告别都留不下。可现在，他有了每天抢草莓大福的理由，有了雷打不动趴在你枕边的位置。\n「当初被你的术式变成小猫的时候，」他蹭了蹭你的掌心，「我从没想过，会如此想要守着一个人。」"}];
function checkMS(old){for(var i=0;i<MS.length;i++){var m=MS[i];if(!m.done&&old<m.v&&S.aff>=m.v){m.done=true;showEvent(m.t,m.m,IMGS[m.img]);break;}}}
function showEvent(t,m,img){$('evImg').src=img;$('evTitle').textContent='【'+t+'】';$('evText').textContent=m;$('ev').classList.add('show');}
$('evBtn').addEventListener('click',function(){$('ev').classList.remove('show');if(S.aff>=100&&!S.ended){S.ended=true;}save();});

/* ---------- render ---------- */
function render(){
  $('dayChip').textContent='第 '+S.day+' 天';
  $('stageChip').textContent=stage();
  $('moodChip').textContent='心情：'+moodWord();
  $('satChip').textContent='饱食：'+satWord();
  $('affNum').textContent=S.queried?S.aff:'??';
  $('affBar').style.width=S.aff+'%';
  var idx=S.aff<41?0:S.aff<71?1:S.aff<91?2:3;
  var chips=$('steps').children;
  for(var i=0;i<4;i++)chips[i].className='chip'+(i===idx?' on':'');
  renderActions();
}
function renderActions(){
  var host=$('actions');host.innerHTML='';
  currentActs.forEach(function(a){
    var b=document.createElement('button');
    b.textContent=a[1]?a[0]+a[1]():a[0];
    b.onclick=function(){a[2]();};
    host.appendChild(b);
  });
}
function setActs(list){currentActs=list;renderActions();}

/* ---------- action text pools ---------- */
var P={
feedA:["你从冰箱取出草莓大福。它盯着看了两秒假装不在乎，然后整个扑了上来，奶油沾了满鼻尖。","粉垫按住碟子不撒爪。堂堂最强，为一颗草莓大福折腰。","它吃得很慢，像在品尝什么久违的和平，尾巴却不诚实地翘成了问号。"],
feedB:["它现在连装都懒得装了，听见包装响就一个箭步冲过来，尾巴缠上你的手腕。","它叼走大福跳上最高的柜子，边吃边居高临下地看你。这是信任，也是挑衅。"],
feedH:["白发少年接过大福咬了一口，笑得眉眼弯弯：『你喂猫的手艺倒是没变。』","他变回小猫把大福整只按住，再化成人形时嘴角还沾着奶油。"],
petA:["你的手指穿过蓬松的软毛。它眯起眼，喉咙里滚出一声很轻的呼噜——随即它自己愣了一下，像是不敢相信这身体居然会发出这种声音。","它偏头躲开半寸，想了想，又自己把头挪回你的手下。","尾巴悄悄缠上你的手腕，圈了一圈，没收。"],
petB:["它主动把脑袋塞进你的手心，蹭完左边蹭右边，顺便用尾巴抽了一下你的胳膊。","你一抬手它就凑过来，蹭完还嫌不够，用后脑勺又顶了两下。"],
petH:["他弯下腰任你揉乱白毛，六眼眯起来：『摸够了吗？……没有就继续。』","白猫的虚影在他身后一闪而过，是被你rua出来的。"],
hugA:["湿毛早就干了，抱起来是一团温热的云。它把下巴搁在你臂弯，装睡。","它浑身绷了一瞬，然后一点点松下来，把重量交给你。","你的心跳贴着它的耳朵。它忽然觉得，这样的安静也不坏。"],
hugB:["它先在你怀里踩了两圈奶，然后才安分下来。它拒绝承认刚才那个动作是它做的。","被抱住的时候它会叹气——猫怎么叹气你别问。然后往你怀里又钻了钻。"],
hugH:["它先伸手把你圈进怀里，然后自己变成猫窝在你臂弯。『这样比较暖和。』","拥抱持续了很久。它低声说：『新宿那天之后，我以为再也抱不到谁了。』"],
talkA:["你对一只猫认真搭话，它冰蓝猫眼一眨不眨地盯着你，像在看什么新鲜事。","你讲到新宿那场雨，它的瞳孔缩了缩，低下头，把尾巴绕住自己的爪子。","说到一半你停下来，它伸出肉垫碰了碰你的指尖，像在问：然后呢？"],
talkB:["它现在会接话了。你说一句，它喵一声，尾音上扬，像在对账。","夜深时它听得格外认真，瞳孔缩成细线，里面有你看不懂的旧战场。"],
talkH:["『你想听新宿的事吗？』它望着窗外，『……今天算了。今天只想听你说话。』","它说起做猫时的糗事滔滔不绝，说到战场就停下来，用玩笑把话头接走。"],
sleep:["夜深了。它跳上你的床，在枕边团成一小团白。半梦半醒间，你感觉它往你这边挪了挪。","关灯后你能听见它很轻的呼吸声。这呼吸曾经停在新宿的战场上，此刻却安稳地落在你枕侧。","它照例睡在枕边。半夜你翻身，尾巴尖扫过你的脸颊，像一句没说出口的晚安。"]
};
function tier(k){return S.aff>=71?k+'H':S.aff>=41?k+'B':k+'A'}

/* ---------- actions ---------- */
function aFeed(){
  if(S.inv.d<=0){S.mood=Math.max(0,S.mood-2);say("你打开冰箱——草莓大福库存为零。\n它用一种『你最好解释清楚』的眼神看着你。");render();save();return;}
  S.inv.d--;var bonus=S.sat<25?1:0;
  var g=2+Math.floor(Math.random()*3)+bonus;
  gain(g,8,35);setAvatar('cat_happy');
  say(pick(P[tier('feed')])+(bonus?"\n它饿坏了，连掉在碟子边的一粒糯米都舔干净了。":""));
}
function aPet(){gain(1+Math.floor(Math.random()*3),8);setAvatar('cat_happy');say(pick(P[tier('pet')]));}
function aHug(){S.hugN++;
  if(S.hugN%3===0){S.annoyed=true;shakeAvatar();gain(1,-5);say("抱到第三下，它终于扭身跳出去，背对你坐下，尾巴大力甩了两下。\n……两秒后又挪回你脚边。");setTimeout(function(){S.annoyed=false;render();save();},20000);return;}
  gain(1+Math.floor(Math.random()*3),6);setAvatar(S.aff>=41?'chibi_shy':defaultAvatar());say(pick(P[tier('hug')]));
}
function aTalk(){gain(1+Math.floor(Math.random()*2),4);setAvatar();say(pick(P[tier('talk')]));}
function aWalk(){setScene('park');gain(1+Math.floor(Math.random()*2),6);
  if(Math.random()<0.25){S.annoyed=true;say("一只流浪橘猫从墙头跳下来，蹭了蹭你的裤脚。\n它当场背过身，尾巴甩成了风车。三秒后又挪回你脚边，用屁股撞你的脚踝。");setTimeout(function(){S.annoyed=false;render();save();},20000);}
  else say("它走在你脚边，不快不慢。路灯把你们的影子拉得很长，它的那一小团，紧紧贴着你的。");}
function aStore(){setScene('store');gain(1,2);say("便利店的暖气涌出来，关东煮的香气飘了一整个门口。\n怀里的小东西鼻尖一动，脑袋已经转向甜品柜的方向。");}
function aBuyD(){S.inv.d++;gain(1,4);setAvatar('cat_happy');say("你拿了一盒草莓大福。它的视线牢牢黏在盒子上，喉咙里发出一声短促的『呜』，随即把脸埋回你臂弯，假装什么都没发生。");}
function aBuyM(){gain(1,6,5);setAvatar('cat_happy');say("热牛奶的甜香在微波炉『叮』的一声后弥漫开来。它的耳朵整个竖了起来，尾巴尖在你手腕上勾了又勾。");}
function aGoHome(){setScene('home');gain(1,2);say("钥匙转动的声音很轻。它在你怀里抬起头，把这个陌生的、属于你的空间，从头到脚打量了一遍。\n——从今天起，这里也是它的据点了。");}
function aStroll(){gain(1+Math.floor(Math.random()*2),5);
  if(Math.random()<0.2){S.annoyed=true;say("远处传来野猫打架的动静。它突然压低身体挡在你脚前，喉咙里滚出低低的呜声——半秒后才反应过来自己现在只是一只奶猫，整只猫僵在原地。");setTimeout(function(){S.annoyed=false;render();save();},20000);}
  else say(pick(["夜公园的树影很深。它走两步回头看你一眼，确认你跟上了，才继续往前。","长椅边有一小片积水，它绕着走，很有最强风范——然后一脚踩了进去，整只猫当场定格。"]));}
function aPkPet(){gain(1+Math.floor(Math.random()*3),7);setAvatar('cat_happy');say("你蹲下来挠它的下巴。它舒服得整只摊平在落叶上，四脚朝天，露出柔软的肚皮——随即猛然警觉地翻身护住，警惕地看了你一眼。");}
function aSleep(){
  S.day++;S.sat=Math.max(5,S.sat-20);S.mood=Math.max(15,Math.min(85,S.mood+(Math.random()<0.5?-5:8)));
  setScene('home');render();save();
  say(pick(P.sleep),function(){save();});
}
function aQuery(){S.queried=true;say("你凝神感应——你的生得术式回馈来一串模糊的刻度。\n当前好感："+S.aff+" / 100");render();save();}

/* ---------- scene action sets ---------- */
var ACTS={
  home:[['喂草莓大福',function(){return '（库存 '+S.inv.d+'）'},aFeed],['摸摸头',null,aPet],['抱进怀里',null,aHug],['陪它说话',null,aTalk],['出门散步',null,aWalk],['去便利店',null,aStore],['入睡 · 结束今天',null,aSleep]],
  store:[['买草莓大福',function(){return '（库存 '+S.inv.d+'）'},aBuyD],['买热牛奶',null,aBuyM],['回家',null,aGoHome]],
  park:[['慢慢散步',null,aStroll],['蹲下摸它',null,aPkPet],['去便利店',null,aStore],['回家',null,aGoHome]]
};

/* ---------- opening ---------- */
var OPEN=["雨是半夜停的。\n新宿那场仗你只在传闻里听过——废墟清理了半个月，新闻换了三轮，到了今天，已经没什么人再提了。", "你撑着伞拐过巷口，在便利店后门的屋檐下，看见了一团白。\n巴掌大的小奶猫，湿漉漉地蜷在纸箱残片边上，雪白的毛吸饱了雨水，贴成一缕一缕。", "听见脚步声，它倏地抬起头。\n冰蓝色的眼睛，圆瞳亮得过分，里面没有幼兽该有的浑浊。它直直地看着你，不躲也不叫，像是先一步把你从头到脚打量了一遍——评估完毕，才慢吞吞直起身。\n然后，它试探着，伸出一只粉色的肉垫。\n肉垫停在离你指尖一寸的地方，不动了。"];
function runOpen(){
  if(S.beat<OPEN.length){say(OPEN[S.beat],function(){S.beat++;runOpen();});}
  else{setActs([['抱起它',null,function(){S.phase='play';gain(2,6);setScene('home');setActs(ACTS.home);say("它在你怀里绷了一瞬，然后一点点松下来，把重量交给你。\n雨檐的水滴落在身后，啪嗒，啪嗒。你带着这团温热的小东西，回了家。");}],['为它撑伞',null,function(){S.phase='play';gain(1,4);setScene('home');setActs(ACTS.home);say("你在屋檐下陪它站了一会儿，把伞往它那边偏了偏。雨小了，它盯着你看了很久，然后迈着小短腿，跟在你脚边回了家。");}]]);}
}

/* ---------- boot ---------- */
function startGame(s){S=s;$('title').style.display='none';$('game').style.display='block';
  setScene(S.scene);render();
  if(S.phase==='title'){S.phase='opening';runOpen();}
  else{setActs(ACTS[S.scene]||ACTS.home);say("——第 "+S.day+" 天——\n你回来时，它正趴在窗台上。听见开门声，那双冰蓝的眼睛准确无误地转了过来。");}
}
$('titleBg').src=IMGS.street;
var sv=load();
if(sv){$('btnContinue').style.display='inline-block';}
$('btnStart').onclick=function(){if(sv&&!confirm('已有存档，开始新游戏会覆盖进度。确定？'))return;startGame(fresh());};
$('btnContinue').onclick=function(){startGame(sv);};
$('btnQuery').onclick=function(){if(!S||S.phase==='title')return;aQuery();};
$('btnReset').onclick=function(){if(!S)return;if(confirm('确定要清空存档、从头开始吗？')){localStorage.removeItem(SAVE_KEY);location.reload();}};
</script>
